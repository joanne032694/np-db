<style>
:root{
  --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8; --line:#e2e8f0;

  --adv:#047857; --ind:#10b981; --lrn:#f59e0b; --none:#f1f5f9; --red:#dc2626; --orange:#ea580c;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:linear-gradient(90deg,#3b0764,#6d28d9);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px}
header .meta{margin-left:auto;font-size:12px;opacity:.85;display:flex;gap:10px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#94a3b8;display:inline-block}
.dot.ok{background:#4ade80}.dot.warn{background:#fbbf24}
nav{display:flex;gap:4px;padding:10px 22px 0;background:var(--bg);flex-wrap:wrap;position:sticky;top:52px;z-index:15}
nav a{padding:9px 16px;border-radius:10px 10px 0 0;color:var(--ink2);text-decoration:none;font-weight:600;font-size:13.5px}

main{max-width:1280px;margin:0 auto;padding:16px 22px 60px}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.06);padding:18px 20px;margin-bottom:16px;border:1px solid var(--line)}
.card h2{font-size:15px;margin:0 0 4px}
.sub{color:var(--ink2);font-size:12.5px;margin:0 0 12px;line-height:1.6}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--ink2)}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .n{font-size:11.5px;color:var(--ink3);margin-top:2px}
.kpi.alert .v{color:var(--red)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:#f8fafc;color:var(--ink2);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
td{padding:9px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:hover td{background:#fafaff}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-adv{background:#d1fae5;color:#065f46}.p-ind{background:#dcfce7;color:#15803d}.p-lrn{background:#fef3c7;color:#92400e}.p-none{background:#f1f5f9;color:#64748b}
.p-red{background:#fee2e2;color:#b91c1c}.p-orange{background:#ffedd5;color:#c2410c}.p-gray{background:#f1f5f9;color:#64748b}
.p-H{background:#ede9fe;color:#5b21b6}.p-M{background:#e0f2fe;color:#075985}.p-L{background:#f1f5f9;color:#64748b}
.t1{background:#fef3c7;color:#b45309}.t2{background:#dbeafe;color:#1d4ed8}.t3{background:#dcfce7;color:#15803d}.t4{background:#ede9fe;color:#6d28d9}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;color:var(--ink)}
button:hover{border-color:#c4b5fd}
.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.primary:hover{background:var(--brand2)}
.danger{color:var(--red);border-color:#fecaca}
.sm{padding:4px 9px;font-size:12px}
input,select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;background:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto}

.modal{background:#fff;border-radius:16px;max-width:980px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}

.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.dcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.dcard h4{margin:0 0 6px;font-size:14px;display:flex;gap:8px;align-items:center}

.proc{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:12px;margin:5px 0}
.proc .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.proc .ct{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
details summary{cursor:pointer;color:var(--brand);font-size:12.5px;margin-top:6px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1e1b4b;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;display:none;max-width:90vw}
.strip{position:relative;height:16px;min-width:140px;background:linear-gradient(#e2e8f0,#e2e8f0) center/100% 1px no-repeat}

.strip b{position:absolute;top:1px;width:2px;height:14px;background:#1e1b4b;margin-left:-1px}
.reqlist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:8px}
.reqlist label{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:12.5px;border-bottom:1px dashed #f1f5f9}
.reqlist label span.c{margin-left:auto;color:var(--ink3);font-variant-numeric:tabular-nums}
.deptrow{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.deptrow .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer}
.deptrow .chips{font-size:12px;color:var(--ink2);margin-top:6px;line-height:1.7}
.hidden{display:none!important}
a.lnk{color:var(--brand);cursor:pointer;text-decoration:none;font-weight:600}
a.lnk:hover{text-decoration:underline}
@media (max-width:700px){main{padding:12px}header{padding:12px}nav{top:auto;position:static;padding:8px 12px 0}nav a{padding:8px 10px}}

<body>
<header>
  <h1>🩺 專責護理師人才技能盤點</h1>
  <div class="meta"><span class="dot" id="connDot"></span><span id="connTxt">連線中…</span><span id="hdrCount"></span></div>

  <div id="banners"></div>
  <section id="v-overview"></section>
  <section id="v-matrix" class="hidden"></section>

<script>
"use strict";
/* ---------- utilities ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtN = n => Number(n).toLocaleString("zh-TW");
function toast(msg, ms = 2800){ const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", ms); }
const dInt = (y,m,d) => y*10000 + m*100 + d;
const dStr = n => n ? `${Math.floor(n/10000)}-${String(Math.floor(n/100)%100).padStart(2,"0")}-${String(n%100).padStart(2,"0")}` : "—";
const dUTC = n => Date.UTC(Math.floor(n/10000), Math.floor(n/100)%100 - 1, n%100);
const dayDiff = (a,b) => Math.round((dUTC(b) - dUTC(a)) / 86400000);
const median = arr => { if (!arr.length) return null; const s = [...arr].sort((a,b)=>a-b); const m = s.length>>1; return s.length%2 ? s[m] : Math.round((s[m-1]+s[m])/2); };
function lowerBound(arr, x){ let lo=0, hi=arr.length; while(lo<hi){ const m=(lo+hi)>>1; if(arr[m]<x) lo=m+1; else hi=m; } return lo; }
function upperBound(arr, x){ let lo=0, hi=arr.length; while(lo<hi){ const m=(lo+hi)>>1; if(arr[m]<=x) lo=m+1; else hi=m; } return lo; }
function todayInt(){ const t = new Date(); return dInt(t.getFullYear(), t.getMonth()+1, t.getDate()); }
function tenure(hire){
  if (!hire) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(hire); if (!m) return null;
  const t = new Date(); let months = (t.getFullYear()-+m[1])*12 + (t.getMonth()+1-+m[2]); if (t.getDate() < +m[3]) months--;
  if (months < 0) months = 0;
  return { months, label: `${Math.floor(months/12)}年${months%12}月` };
}
function tenureCls(months){ return months < 24 ? "t1" : months < 60 ? "t2" : months < 120 ? "t3" : "t4"; }

/* ---------- date parsing (西元 / 民國 / Excel 序號) ---------- */
function parseDate(v){
  if (v === null || v === undefined || v === "") return null;
  if (v instanceof Date && !isNaN(v)) return dInt(v.getFullYear(), v.getMonth()+1, v.getDate());
  if (typeof v === "number"){
    if (v > 19000000 && v < 30000000) return valid(Math.floor(v/10000), Math.floor(v/100)%100, Math.floor(v)%100);
    if (v >= 800000 && v < 2000000){ const y = Math.floor(v/10000)+1911; return valid(y, Math.floor(v/100)%100, Math.floor(v)%100); }
    if (v > 20000 && v < 80000){ const ms = Math.round((v - 25569) * 86400000); const d = new Date(ms); return dInt(d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate()); }
    return null;
  }
  let s = String(v).trim();
  if (/^\d{7,8}$/.test(s)) return parseDate(Number(s));
  const m = /(\d{2,4})\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})/.exec(s);
  if (m){ let y = +m[1]; if (y < 1911) y += 1911; return valid(y, +m[2], +m[3]); }
  return null;
  function valid(y,mo,d){ return (y>1990 && y<2100 && mo>=1 && mo<=12 && d>=1 && d<=31) ? dInt(y,mo,d) : null; }
}
function splitNames(v){ return splitPeople(v).map(x => x.name); }
function splitPeople(v){
  if (v === null || v === undefined) return [];
  const out = [];
  for (let tok of String(v).split(/[,，、\/;；\n\r+＋]+/)){
    tok = tok.trim(); if (!tok) continue;
    let eid = "";
    let m = /^([A-Za-z]?\d{3,})\s*[-－_—:：\s]\s*(.+)$/.exec(tok);      // 12822-劉坤周
    if (m){ eid = m[1]; tok = m[2]; }
    else if ((m = /^(.+?)\s*[(（\[]\s*([A-Za-z]?\d{3,})\s*[)）\]]$/.exec(tok))){ tok = m[1]; eid = m[2]; }   // 劉坤周(12822)
    for (const part of tok.split(/\s+/)){
      const name = part.replace(/[0-9０-９()（）\[\]【】#＃:：*＊\-－_—]/g, "").trim();
      if (name.length >= 2 && !/^(無|NA|N\/A|nil|null)$/i.test(name)) out.push({ name, eid });
    }
  }
  return out;
}

/* ---------- state ---------- */
const DEFAULTS = { thr: 3, high: 70, mid: 90, minCases: 20, req: {}, exclude: ["眼科","產房"] };
function isExcluded(dept){ const ex = Array.isArray(S.settings.exclude) ? S.settings.exclude : DEFAULTS.exclude; return ex.some(k => k && String(dept).includes(k)); }
const S = {
  db: null, dbState: "connecting", canWrite: true,
  imports: [], chunks: {}, staff: {}, settings: { ...DEFAULTS }, judg: {},
  demo: false, memImports: [], memChunks: {},
  view: "overview", model: null,
  ui: { matrixMode: "level", matrixSort: "count", peopleSort: "count", search: "", showHidden: false, daysDeptSort: "median", pending: [], openDept: null }
};

/* ---------- records ---------- */
function allRecords(){
  const imps = S.demo ? S.memImports : S.imports.concat(S.memImports);
  const chunks = S.demo ? S.memChunks : Object.assign({}, S.chunks, S.memChunks);
  const ok = new Set(imps.map(i => i.id));
  const out = [];
  for (const id in chunks){
    const c = chunks[id]; if (!c || !ok.has(c.imp)) continue;
    for (const r of c.rows) out.push({ d: r[0], dept: c.depts[r[1]], proc: c.procs[r[2]], np: c.names[r[3]] });
  }
  return { rows: out, imports: imps };
}
function staffByName(){
  const m = {}; for (const id in S.staff){ const s = S.staff[id]; if (s && s.name) m[s.name] = { ...s, _id: id }; } return m;
}

/* ---------- compute model ---------- */
function compute(){
  const all = allRecords(); const imports = all.imports;
  const excludedDepts = {}; const rows = [];
  const removed = new Set(S.settings.removed || []);
  for (const r of all.rows){ if (removed.has(r.np)) continue; if (isExcluded(r.dept)) excludedDepts[r.dept] = (excludedDepts[r.dept]||0) + 1; else rows.push(r); }
  const st = S.settings; const thr = Math.max(1, +st.thr || 3);
  const deptMap = new Map(); const npMap = new Map();
  let minD = Infinity, maxD = 0;
  for (const r of rows){
    if (r.d){ if (r.d < minD) minD = r.d; if (r.d > maxD) maxD = r.d; }
    let dm = deptMap.get(r.dept); if (!dm){ dm = { name: r.dept, total: 0, procs: new Map(), nps: new Set() }; deptMap.set(r.dept, dm); }
    dm.total++; dm.procs.set(r.proc, (dm.procs.get(r.proc)||0)+1); dm.nps.add(r.np);
    let nm = npMap.get(r.np); if (!nm){ nm = { name: r.np, rows: [], dates: new Set() }; npMap.set(r.np, nm); }
    nm.rows.push(r); nm.dates.add(r.d);
  }
  // department tiers
  const depts = [];
  for (const dm of deptMap.values()){
    const procs = [...dm.procs.entries()].map(([name,count]) => ({ name, count, share: count/dm.total })).sort((a,b)=>b.count-a.count || a.name.localeCompare(b.name));
    let cum = 0, hN = 0;
    for (const p of procs){
      let t = cum*100 < st.high ? "H" : cum*100 < st.mid ? "M" : "L";
      if (t === "H" && hN >= 10) t = "M";
      if (t === "H") hN++;
      p.tier = t; cum += p.share;
    }
    const custom = Array.isArray(st.req?.[dm.name]) ? st.req[dm.name].filter(n => dm.procs.has(n)) : null;
    const req = custom && custom.length ? custom : procs.filter(p => p.tier === "H").map(p => p.name);
    const reqSet = new Set(req);
    const mid = procs.filter(p => p.tier !== "L" && !reqSet.has(p.name)).map(p => p.name);
    depts.push({ name: dm.name, total: dm.total, procs, req, mid, custom: !!(custom && custom.length), npCount: dm.nps.size, eligible: dm.total >= (+st.minCases||0) });
  }
  depts.sort((a,b) => b.total - a.total);
  const deptByName = Object.fromEntries(depts.map(d => [d.name, d]));
  // people
  const staff = staffByName();
  const people = [];
  const names = new Set([...npMap.keys(), ...Object.keys(staff)]);
  for (const name of names){
    if (removed.has(name)) continue;
    const nm = npMap.get(name) || { name, rows: [], dates: new Set() };
    const s = staff[name] || {};
    const dates = [...nm.dates].filter(Boolean).sort((a,b)=>a-b);
    const rowsBy = {};
    for (const r of nm.rows.sort((a,b)=>a.d-b.d)) (rowsBy[r.dept] ||= []).push(r);
    const skills = {};
    for (const dname in rowsBy){
      const dep = deptByName[dname]; const rs = rowsBy[dname];
      const counts = {}; const reqSet = new Set(dep.req);
      let remaining = dep.req.length, reach = null;
      for (const r of rs){
        const c = (counts[r.proc] = (counts[r.proc]||0) + 1);
        if (c === thr && reqSet.has(r.proc)){ remaining--; if (remaining === 0 && reach === null) reach = r.d; }
      }
      const first = rs[0].d, last = rs[rs.length-1].d;
      let progress = dep.req.length ? dep.req.reduce((a,p) => a + Math.min(counts[p]||0, thr), 0) / (thr*dep.req.length) : 0;
      const adv = reach !== null && dep.mid.length > 0 && dep.mid.every(p => (counts[p]||0) >= thr);
      const auto = reach !== null ? "ok" : "lrn";
      const dated = first > 0 && reach !== null && reach > 0;
      const dense = dated ? (upperBound(dates, reach) - lowerBound(dates, first)) : null;
      const cal = dated ? dayDiff(first, reach) + 1 : null;
      skills[dname] = { dept: dname, cases: rs.length, counts, first, last, reach, auto, adv, progress, dense, cal, days: new Set(rs.map(r=>r.d)).size };
    }
    const J = S.judg[name] || {};
    for (const dname in J) if (!skills[dname] && deptByName[dname]) skills[dname] = { dept: dname, cases: 0, counts: {}, first: null, last: null, reach: null, auto: "lrn", adv: false, progress: 0, dense: null, cal: null, days: 0 };
    for (const dname in skills){ const j = J[dname]; const k = skills[dname]; k.status = j?.s === "ind" ? "ind" : j?.s === "no" ? "no" : "pend"; k.jAt = j?.at || ""; }
    const elig = Object.values(skills).filter(k => deptByName[k.dept].eligible);
    people.push({
      name, eid: s.eid || "", hire: s.hire || "", hidden: !!s.hidden, staffId: s._id || null, manual: !!s._id,
      skills, cases: nm.rows.length, workDays: dates.length, first: dates[0] || null, last: dates[dates.length-1] || null,
      nInd: elig.filter(k => k.status === "ind").length, nNo: elig.filter(k => k.status === "no").length, nPend: elig.filter(k => k.status === "pend").length,
      nSugg: elig.filter(k => k.status === "pend" && k.auto === "ok").length,
      tenure: tenure(s.hire)
    });
  }
  const visible = people.filter(p => S.ui.showHidden || !p.hidden);
  // dept stats
  for (const d of depts){
    const ks = visible.map(p => p.skills[d.name]).filter(Boolean);
    d.nInd = ks.filter(k => k.status === "ind").length;
    d.nNo = ks.filter(k => k.status === "no").length;
    d.nPend = ks.filter(k => k.status === "pend").length;
    d.nSugg = ks.filter(k => k.status === "pend" && k.auto === "ok").length;
    const dense = ks.filter(k => k.dense !== null).map(k => k.dense);
    const cal = ks.filter(k => k.cal !== null).map(k => k.cal);
    d.dense = dense; d.medDense = median(dense); d.minDense = dense.length ? Math.min(...dense) : null; d.maxDense = dense.length ? Math.max(...dense) : null; d.medCal = median(cal);
    d.risk = !d.eligible ? null : d.nInd === 0 ? (d.nNo === 0 && d.nPend > 0 ? "unjudged" : "none") : d.nInd === 1 ? "single" : null;
  }
  S.model = { excludedDepts, rows: rows.length, imports, minD: maxD ? minD : null, maxD: maxD || null, depts, deptByName, people, visible, thr };
}

/* ---------- rendering ---------- */
const STATUS = { ind: ["可獨立", "p-ind"], no: ["不可獨立", "p-orange"], pend: ["未判定", "p-gray"], none: ["未接觸", "p-none"] };
function suggPill(k){ return k.cases ? (k.auto === "ok" ? `<span class="pill" style="border:1px dashed #10b981;color:#047857;background:#fff">系統建議：可獨立</span>` : `<span class="pill" style="border:1px dashed #f59e0b;color:#92400e;background:#fff">系統：學習中 ${Math.round(k.progress*100)}%</span>`) : `<span class="pill p-gray">無手術紀錄</span>`; }
function judgeBtns(name, dept, k){
  const a = `'${esc(jsq(name))}','${esc(jsq(dept))}'`;
  return `<span class="row" style="gap:4px;flex-wrap:nowrap"><button class="sm ${k?.status==="ind"?"primary":""}" style="${k?.status==="ind"?"background:#059669;border-color:#059669":""}" onclick="setJudge(${a},'ind')">✓ 可獨立</button><button class="sm" style="${k?.status==="no"?"background:#f59e0b;border-color:#f59e0b;color:#fff":""}" onclick="setJudge(${a},'no')">✗ 不可獨立</button>${k && k.status!=="pend"?`<button class="sm" title="清除判定" onclick="setJudge(${a},null)">↺</button>`:""}</span>`;
}
function pill(st){ const [t,c] = STATUS[st]; return `<span class="pill ${c}">${t}</span>`; }
function tierPill(t){ return `<span class="pill p-${t}">${{H:"高頻 必訓",M:"中頻 進階",L:"低頻 選修"}[t]}</span>`; }
function cellColor(k){
  if (!k) return ["#f8fafc","#cbd5e1"];
  if (k.status === "ind") return ["#10b981","#fff"];
  if (k.status === "no") return ["#fcd34d","#78350f"];
  return k.auto === "ok" ? ["#ecfdf5","#047857"] : ["#f1f5f9","#64748b"];
}

function renderOverview(){

  for (const d of elig){
    const w = n => (n/maxN*100).toFixed(1)+"%";
    h += `<tr><td><a class="lnk" onclick="openDept('${esc(jsq(d.name))}')">${esc(d.name)}</a></td><td class="num">${fmtN(d.total)}</td><td class="num">${d.req.length}${d.custom?' <span class="muted" title="已自訂">✎</span>':''}</td>
      <td class="num"><b>${d.nInd}</b></td><td class="num">${d.nNo}</td><td class="num">${d.nPend}</td><td class="num">${d.nSugg?`<span style="color:#047857">${d.nSugg}</span>`:'<span class="muted">0</span>'}</td>
      <td><div class="bar"><i style="width:${w(d.nInd)};background:var(--ind)"></i><i style="width:${w(d.nNo)};background:#fcd34d"></i><i style="width:${w(d.nPend)};background:#cbd5e1"></i></div></td>

  }
  h += `</tbody></table></div>`;
  const low = M.depts.filter(d => !d.eligible);
  if (low.length) h += `<p class="sub" style="margin-top:10px">案量不足 ${S.settings.minCases} 例、未列入盤點：${low.map(d => esc(d.name)+`（${d.total}）`).join("、")}</p>`;

  if (!queue.length) h += `<p class="muted">全部都判定完了 👍</p>`;
  else {
    h += `<div class="tw"><table><thead><tr><th>姓名</th><th>科別</th><th class="num">案件</th><th>系統建議</th><th>還差的必訓術式</th><th>最近一次</th><th>判定</th></tr></thead><tbody>`;
    for (const { p, k } of queue.slice(0, 60)){

      const miss = dep.req.filter(x => (k.counts[x]||0) < M.thr).map(x => `${esc(short(x, 28))}（${k.counts[x]||0}/${M.thr}）`);
      h += `<tr><td><a class="lnk" onclick="openPerson('${esc(jsq(p.name))}','${esc(jsq(k.dept))}')">${esc(p.name)}</a></td><td>${esc(k.dept)}</td><td class="num">${k.cases}</td>
        <td>${suggPill(k)}</td><td style="font-size:12px;max-width:320px">${miss.join("、") || '<span class="muted">—</span>'}</td><td>${dStr(k.last)}</td><td>${judgeBtns(p.name, k.dept, k)}</td></tr>`;
    }

  }
  h += `</div>`;
  el.innerHTML = h;
}
function short(s, n = 34){ s = String(s); return s.length > n ? s.slice(0, n) + "…" : s; }
function jsq(s){ return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

function sortedPeople(list, mode){
  const a = [...list];
  if (mode === "count") a.sort((x,y) => y.nInd - x.nInd || y.nPend - x.nPend || x.name.localeCompare(y.name));
  else if (mode === "hireNew") a.sort((x,y) => (y.hire||"").localeCompare(x.hire||"") || x.name.localeCompare(y.name));
  else if (mode === "hireOld") a.sort((x,y) => (x.hire||"9999").localeCompare(y.hire||"9999") || x.name.localeCompare(y.name));
  else if (mode === "cases") a.sort((x,y) => y.cases - x.cases);
  else a.sort((x,y) => x.name.localeCompare(y.name, "zh-Hant"));
  return a;
}

/* ---------- import ---------- */
function setupDrop(){
  const z = $("#drop"); if (!z) return;
  z.ondragover = e => { e.preventDefault(); z.classList.add("over"); };
  z.ondragleave = () => z.classList.remove("over");
  z.ondrop = e => { e.preventDefault(); z.classList.remove("over"); handleFiles(e.dataTransfer.files); };
}
async function readTable(file){
  if (typeof XLSX === "undefined") throw new Error("試算表讀取元件沒有載入，請重新整理頁面再試。");
  const buf = await file.arrayBuffer();
  let wb;
  if (/\.(csv|tsv|txt)$/i.test(file.name)){
    let text = new TextDecoder("utf-8").decode(buf);
    if (text.includes(String.fromCharCode(0xFFFD))) { try { text = new TextDecoder("big5").decode(buf); } catch(e){} }
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const tsv = /\.tsv$/i.test(file.name) || (text.split("\n")[0].split("\t").length > text.split("\n")[0].split(",").length);
    wb = XLSX.read(text, { type: "string", FS: tsv ? "\t" : ",", raw: true });
  } else wb = XLSX.read(buf, { type: "array" });
  let best = null;
  for (const sn of wb.SheetNames){
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: "", raw: true });
    for (let i = 0; i < Math.min(15, aoa.length); i++){
      const hdr = aoa[i].map(x => String(x).replace(/\s/g, ""));
      const col = findCols(hdr);
      if (col.dept >= 0 && col.np >= 0){
        const body = aoa.slice(i+1);
        const n = body.filter(r => String(r[col.dept] ?? "").trim()).length;
        if (!best || n > best.n) best = { sheet: sn, hdr, col, body, n, sheets: wb.SheetNames.length };
        break;
      }
    }
  }
  if (best) return best;
  throw new Error("找不到「科別名稱」與「專責護理師」欄位。請確認第一列是欄位名稱。");
}
function findCols(h){
  const f = (...tests) => { for (const t of tests){ const i = h.findIndex(t); if (i >= 0) return i; } return -1; };
  return {
    dept: f(x => x === "科別名稱", x => x.includes("科別")),
    proc: f(x => x === "主手術名稱", x => x.includes("主手術"), x => x.includes("手術名稱"), x => x.includes("術式")),
    np: f(x => x.includes("專責護理師"), x => x.includes("專責")),
    date: f(x => x === "手術日期", x => x.includes("手術日"), x => x.includes("開刀日"), x => x.includes("日期") && !x.includes("出生") && !x.includes("住院") && !x.includes("出院"), x => x === "日期")
  };
}
async function parseFile(file, extraOverlap){
  const t = await readTable(file);
  if (t.col.proc < 0) throw new Error("找不到「主手術名稱」欄位。");
  const rows = []; let badDate = 0, noNp = 0, total = 0, cases = 0; const eids = {};
  for (const r of t.body){
    const dept = String(r[t.col.dept] ?? "").trim(); const proc = String(r[t.col.proc] ?? "").trim();
    if (!dept && !proc) continue;
    total++;
    const ppl = splitPeople(r[t.col.np]); if (!ppl.length){ noNp++; continue; }
    const names = ppl.map(x => x.name); for (const x of ppl) if (x.eid && !eids[x.name]) eids[x.name] = x.eid;
    let d = 0; if (t.col.date >= 0){ d = parseDate(r[t.col.date]); if (!d){ badDate++; continue; } }
    cases++;
    for (const n of names) rows.push({ d, dept: dept || "（未填科別）", proc: proc || "（未填術式）", np: n });
  }
  if (!rows.length) throw new Error(`讀到 ${total} 筆手術，但沒有任何一筆有專責護理師${t.col.date>=0?"與可辨識的日期":""}。`);
  let minD = Infinity, maxD = 0; for (const r of rows){ if (r.d < minD) minD = r.d; if (r.d > maxD) maxD = r.d; }
  if (!maxD){ minD = 0; maxD = 0; }
  const others = S.imports.concat(S.memImports, extraOverlap);
  const overlap = maxD ? others.filter(im => im.maxD && !(im.maxD < minD || im.minD > maxD)) : [];
  return { file: file.name, sheet: t.sheet, sheets: t.sheets, eids, cases, rows, total, noNp, badDate, minD, maxD, overlap, cols: t.col, hdr: t.hdr, names: new Set(rows.map(r=>r.np)).size, depts: new Set(rows.map(r=>r.dept)).size };
}
async function handleFiles(fileList){
  const files = [...(fileList || [])]; if (!files.length) return;
  if (S.demo) exitDemo(true);
  if (S.view !== "data") go("data");
  toast(`讀取 ${files.length} 個檔案中…`, 20000);
  const list = [];
  for (const f of files){
    try { list.push(await parseFile(f, list.filter(x => !x.error))); }
    catch (e) { list.push({ file: f.name, error: e.message || String(e) }); }
  }
  list.sort((a,b) => (a.minD||0) - (b.minD||0));
  S.ui.pending = list;
  $("#toast").style.display = "none";
  renderPending();
  const el = $("#pending"); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
}
function renderPending(){
  const el = $("#pending"); if (!el) return; const L = S.ui.pending || [];
  if (!L.length){ el.innerHTML = ""; return; }
  const ok = L.filter(P => !P.error);

async function commitPending(){

async function applyEids(L){
  const all = {}; for (const P of L) Object.assign(all, P.eids || {});
  const have = staffByName();
  for (const name in all){
    const ex = have[name]; if (ex && ex.eid) continue;
    const id = ex?._id || ("s" + Date.now().toString(36) + Math.random().toString(36).slice(2,6));
    const body = { name, eid: all[name], hire: ex?.hire || "", hidden: ex?.hidden || false };
    S.staff[id] = body;
    if (S.db && S.dbState === "ok" && !S.demo && S.canWrite){ try { await dbRetry(() => S.db.doc(`staff/${id}`).set(body)); } catch (e) {} }
  }
}
async function commitOne(P){
  const id = "i" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const CH = 4000; const chunks = [];
  for (let i = 0; i < P.rows.length; i += CH){
    const part = P.rows.slice(i, i+CH);
    const D = [], Pr = [], N = []; const di = {}, pi = {}, ni = {};
    const idx = (map, arr, v) => map[v] ?? (map[v] = arr.push(v) - 1);
    const rows = part.map(r => [r.d, idx(di, D, r.dept), idx(pi, Pr, r.proc), idx(ni, N, r.np)]);
    chunks.push({ imp: id, depts: D, procs: Pr, names: N, rows });
  }
  const meta = { file: P.file, at: new Date().toISOString().slice(0,19), rows: P.rows.length, minD: P.minD, maxD: P.maxD, chunks: chunks.length };
  if (S.db && S.dbState !== "off" && S.dbState !== "local" && S.canWrite){
    try {
      for (let k = 0; k < chunks.length; k++) await dbRetry(() => S.db.doc(`records/${id}-${k}`).set(chunks[k]));
      await dbRetry(() => S.db.doc(`imports/${id}`).set(meta));
      chunks.forEach((c,k) => S.chunks[`${id}-${k}`] = c);
      if (!S.imports.find(x => x.id === id)) S.imports.push({ id, ...meta });
      return true;
    } catch (e) { handleWriteErr(e); }
  }
  chunks.forEach((c,k) => S.memChunks[`${id}-${k}`] = c); S.memImports.push({ id, mem: true, ...meta });
  return true;
}
function askDeleteImport(id){

async function deleteImport(id){

  const deptNames = Object.keys(D); const rows = [];

    for (let t = from; t <= end; t += 86400000){
      const wd = new Date(t).getUTCDay(); if (wd === 0 || wd === 6 || rnd() < 0.72) continue;
      const age = (t - from) / 86400000; const k = Math.min(prefs.length, 1 + Math.floor(age / 160));

      const n = 1 + Math.floor(rnd()*2);
      const dt = new Date(t); const d = dInt(dt.getUTCFullYear(), dt.getUTCMonth()+1, dt.getUTCDate());
      for (let i = 0; i < n; i++){ const pr = procs[Math.min(procs.length-1, Math.floor(Math.pow(rnd(), 1.8) * procs.length))]; rows.push({ d, dept, proc: pr, np: name }); }

  const Dn = [], Pr = [], N = []; const di = {}, pi2 = {}, ni = {};
  const idx = (m, a, v) => m[v] ?? (m[v] = a.push(v) - 1);
  const chunk = { imp: id, depts: Dn, procs: Pr, names: N, rows: rows.filter(r => rnd() < Math.min(1, W[r.dept] / 3 + 0.3)).map(r => [r.d, idx(di,Dn,r.dept), idx(pi2,Pr,r.proc), idx(ni,N,r.np)]) };
  S.memChunks = { "demo-0": chunk };
  S.memImports = [{ id, file: "範例資料（虛構）", at: new Date().toISOString().slice(0,19), rows: chunk.rows.length, minD: 20240102, maxD: 20261031, chunks: 1, mem: true }];
  S._realStaff = S.staff; S.staff = {};
  people.forEach(([name, hire], i) => S.staff["demo" + i] = { name, hire, eid: String(17000 + i*37), hidden: false });
  S._realSettings = S.settings; S.settings = { ...DEFAULTS };
  S._realJudg = S.judg; S.judg = {};
  S.demo = true; go("overview");
}
function exitDemo(silent){
  S.demo = false; S.memChunks = {}; S.memImports = [];
  if (S._realStaff) S.staff = S._realStaff; if (S._realSettings) S.settings = S._realSettings; if (S._realJudg) S.judg = S._realJudg;
  if (S.dbState === "local"){ loadLocal().then(() => { if (!silent) render(); }); return; }
  if (!silent) render();
}

/* ---------- db ---------- */
async function dbRetry(fn){
  try { return await fn(); }
  catch (e) { if (e && e.code === "unavailable"){ await new Promise(r => setTimeout(r, 600 + Math.random()*800)); return await fn(); } throw e; }
}
function handleWriteErr(e){
  const c = e && e.code;
  if (c === "invalid_argument"){ S.canWrite = false; toast("❌ 你沒有修改這份資料的權限（需要「參與者」以上的分享權限）", 6000); }
  else if (c === "quota_exceeded") toast("❌ 資料庫容量已滿，請刪除較舊的匯入記錄後再試", 6000);
  else if (c === "resource_exhausted") toast("❌ 操作太頻繁，請稍候再試", 5000);
  else toast("❌ 儲存失敗：" + (e && (e.message || e.code) || e), 6000);
}
let renderQueued = false;
function queueRender(){ if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }

async function initDb(){
  let db = null;
  try { db = await claude.use("db"); } catch (e) { db = null; }
  if (!db){ goLocal(); return; }
  S.db = db;
  try { const user = await claude.use("user"); if (user && user.can){ const w = await user.can("data.write"); if (w === false) S.canWrite = false; } } catch (e) {}
  let pending = 5; const got = new Set();
  const timer = setTimeout(() => { if (S.dbState === "connecting"){ S.dbState = "slow"; render(); } }, 10000);
  const done = (key, snap) => {
    if (snap && snap.metadata && !snap.metadata.fromCache && !got.has(key)){ got.add(key); pending--; }
    if (pending <= 0 && S.dbState !== "ok"){ clearTimeout(timer); S.dbState = "ok"; }
    if (!S.demo) queueRender(); else if (pending <= 0) renderHeader();
  };
  const fail = e => { clearTimeout(timer); if (S.dbState !== "ok"){ goLocal(); return; } render(); };
  db.collection("imports").onSnapshot(snap => { S.imports = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() })); done("imports", snap); }, fail);
  db.collection("records").onSnapshot(snap => { const c = {}; for (const d of snap.docs) if (d.exists) c[d.id] = d.data(); S.chunks = c; done("records", snap); }, fail);
  db.collection("staff").onSnapshot(snap => { const st = {}; for (const d of snap.docs) if (d.exists) st[d.id] = d.data(); if (S.demo) S._realStaff = st; else S.staff = st; done("staff", snap); }, fail);
  db.doc("config/judgments").onSnapshot(snap => { const v = snap.exists ? (snap.data().j || {}) : {}; if (S.demo) S._realJudg = v; else S.judg = v; done("judg", snap); }, fail);
  db.doc("config/settings").onSnapshot(snap => { const v = snap.exists ? { ...DEFAULTS, ...snap.data() } : { ...DEFAULTS }; if (S.demo) S._realSettings = v; else S.settings = v; done("config", snap); }, fail);
}

/* ---------- local storage (IndexedDB, 給沒有共用資料庫時用) ---------- */
S.localOk = false;
function idb(){
  return new Promise((res, rej) => {
    try { const r = indexedDB.open("np-skills", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch (e) { rej(e); }
  });
}
async function idbGet(key){ const db = await idb(); return new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(key); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(key, val){ const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(val, key); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function loadLocal(){
  try {
    const v = await idbGet("state");
    S.memImports = v?.imports || []; S.memChunks = v?.chunks || {}; S.staff = v?.staff || {}; S.settings = { ...DEFAULTS, ...(v?.settings || {}) }; S.judg = v?.judg || {};
    S.localOk = true;
  } catch (e) { S.localOk = false; }
}
async function saveLocal(){
  if (S.dbState !== "local" || S.demo || !S.localOk) return;
  try { await idbSet("state", { imports: S.memImports, chunks: S.memChunks, staff: S.staff, settings: S.settings, judg: S.judg }); }
  catch (e) { toast("❌ 無法存到瀏覽器：" + (e && e.message || e), 6000); }
}
async function goLocal(){ S.dbState = "local"; S.db = null; await loadLocal(); render(); }

/* ---------- routing ---------- */
const VIEWS = ["overview","matrix","days","people","data"];
function go(v){ if (location.hash !== "#"+v) location.hash = v; else { S.view = v; render(); } }
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); S.view = VIEWS.includes(v) ? v : "overview"; render(); });
S.view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "overview";
render();
(function waitClaude(t0){
  if (window.claude && typeof window.claude.use === "function") return initDb();
  if (Date.now() - t0 > (window.parent !== window ? 6000 : 800)){ goLocal(); return; }
  setTimeout(() => waitClaude(t0), 150);
})(Date.now());
</script>
